<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Monitoreo Acústico - Nodo ESP32</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4 md:p-8">

  <!-- Encabezado Principal -->
  <header class="max-w-7xl mx-auto mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-800 pb-4">
    <div>
      <h1 class="text-2xl font-bold text-white tracking-wide">Estación de Monitoreo Acústico</h1>
      <p class="text-slate-400 text-sm">Visualización en tiempo real e historial normativo de niveles de ruido</p>
    </div>

    <!-- Controles de Exportación y Limpieza -->
    <div class="flex flex-wrap items-center gap-3 bg-slate-900 p-2.5 rounded-xl border border-slate-800">
      <!-- Filtro por Fechas -->
      <div class="flex items-center gap-2">
        <label for="export-inicio" class="text-xs text-slate-400">Desde:</label>
        <input type="date" id="export-inicio" class="bg-slate-950 border border-slate-700 text-xs text-slate-200 rounded-lg px-2 py-1.5 focus:outline-none focus:border-indigo-500">
        
        <label for="export-fin" class="text-xs text-slate-400">Hasta:</label>
        <input type="date" id="export-fin" class="bg-slate-950 border border-slate-700 text-xs text-slate-200 rounded-lg px-2 py-1.5 focus:outline-none focus:border-indigo-500">
      </div>

      <!-- Botón Exportar CSV -->
      <button onclick="descargarCSVFiltrado()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3.5 py-2 rounded-lg font-medium shadow transition flex items-center gap-1.5">
        📥 Exportar CSV
      </button>

      <!-- Botón Borrar Historial -->
      <button onclick="borrarHistorialFirebase()" class="bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/30 text-xs px-3.5 py-2 rounded-lg font-medium transition flex items-center gap-1.5">
        🗑️ Borrar Historial
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto space-y-6">

    <!-- Tarjetas de Estado en Tiempo Real -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
        <span class="text-xs font-semibold text-indigo-400 uppercase tracking-wider">Último LAeq (1 min)</span>
        <div class="flex items-baseline gap-2 mt-2">
          <span id="val-laeq" class="text-4xl font-extrabold text-white">--</span>
          <span class="text-slate-400 font-medium">dBA</span>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
        <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Último LAmax (1 min)</span>
        <div class="flex items-baseline gap-2 mt-2">
          <span id="val-lamax" class="text-4xl font-extrabold text-white">--</span>
          <span class="text-slate-400 font-medium">dBA</span>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
        <span class="text-xs font-semibold text-sky-400 uppercase tracking-wider">Último LCeq (1 min)</span>
        <div class="flex items-baseline gap-2 mt-2">
          <span id="val-lceq" class="text-4xl font-extrabold text-white">--</span>
          <span class="text-slate-400 font-medium">dBC</span>
        </div>
      </div>
    </section>

    <!-- Gráfica de Serie Temporal (1 min) -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
      <h2 class="text-lg font-semibold text-white mb-4">Histórico Minuto a Minuto ($L_{Aeq}$, $L_{Amax}$, $L_{Ceq}$)</h2>
      <div class="relative w-full h-80">
        <canvas id="chart-1min"></canvas>
      </div>
    </section>

  </main>

  <script>
    // URL REST de Firebase Realtime Database
    const FIREBASE_URL = "https://TU-PROYECTO-FIREBASE-default-rtdb.firebaseio.com/nodo1/historial.json";

    let datosBrutosGlobales = [];
    let chart1MinInstance = null;

    // Inicializar visualización al cargar
    document.addEventListener("DOMContentLoaded", () => {
      inicializarGrafico();
      obtenerDatosFirebase();
      // Actualizar automáticamente cada 30 segundos
      setInterval(obtenerDatosFirebase, 30000);
    });

    // Petición REST a Firebase para obtener historial
    async function obtenerDatosFirebase() {
      try {
        const res = await fetch(FIREBASE_URL);
        if (!res.ok) throw new Error("Error al consultar Firebase");

        const data = await res.json();
        if (!data) {
          datosBrutosGlobales = [];
          actualizarTarjetas(null);
          actualizarGrafico([]);
          return;
        }

        // Convertir respuesta de objeto JSON a arreglo ordenado
        datosBrutosGlobales = Object.keys(data).map(key => {
          const item = data[key];
          
          // Formatear fechas para filtros
          let fechaObj = new Date(item.timestamp * 1000);
          let fechaStr = fechaObj.toISOString().split('T')[0];

          return {
            id: key,
            timestamp: item.timestamp,
            fechaStrOperacional: item.fecha_operacional || fechaStr,
            fechaStrCalendario: fechaStr,
            hora: item.hora ?? fechaObj.getHours(),
            minuto: item.minuto ?? fechaObj.getMinutes(),
            LAeq_1min: item.LAeq_1min ?? null,
            LAmax_1min: item.LAmax_1min ?? null,
            LCeq_1min: item.LCeq_1min ?? null
          };
        }).sort((a, b) => a.timestamp - b.timestamp);

        if (datosBrutosGlobales.length > 0) {
          actualizarTarjetas(datosBrutosGlobales[datosBrutosGlobales.length - 1]);
        }
        actualizarGrafico(datosBrutosGlobales);

      } catch (error) {
        console.error("Error cargando los datos:", error);
      }
    }

    // Actualiza indicadores rápidos en la interfaz
    function actualizarTarjetas(ultimo) {
      document.getElementById('val-laeq').innerText = ultimo && ultimo.LAeq_1min !== null ? ultimo.LAeq_1min.toFixed(1) : '--';
      document.getElementById('val-lamax').innerText = ultimo && ultimo.LAmax_1min !== null ? ultimo.LAmax_1min.toFixed(1) : '--';
      document.getElementById('val-lceq').innerText = ultimo && ultimo.LCeq_1min !== null ? ultimo.LCeq_1min.toFixed(1) : '--';
    }

    // Inicialización de Chart.js
    function inicializarGrafico() {
      const ctx = document.getElementById('chart-1min').getContext('2d');
      chart1MinInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [
            {
              label: 'LAeq 1min (dBA)',
              data: [],
              borderColor: '#818cf8',
              backgroundColor: 'rgba(129, 140, 248, 0.1)',
              borderWidth: 2,
              pointRadius: 1,
              tension: 0.2
            },
            {
              label: 'LAmax 1min (dBA)',
              data: [],
              borderColor: '#34d399',
              borderWidth: 1.5,
              pointRadius: 0,
              tension: 0.2
            },
            {
              label: 'LCeq 1min (dBC)',
              data: [],
              borderColor: '#38bdf8',
              borderWidth: 1.5,
              pointRadius: 0,
              tension: 0.2
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: {
              ticks: { color: '#94a3b8', font: { size: 10 } },
              grid: { color: 'rgba(51, 65, 85, 0.3)' }
            },
            y: {
              ticks: { color: '#94a3b8', font: { size: 10 } },
              grid: { color: 'rgba(51, 65, 85, 0.3)' },
              title: { display: true, text: 'dB', color: '#94a3b8' }
            }
          },
          plugins: {
            legend: { labels: { color: '#e2e8f0', font: { size: 11 } } }
          }
        }
      });
    }

    // Actualiza los puntos representados en el gráfico
    function actualizarGrafico(datos) {
      if (!chart1MinInstance) return;

      const labels = datos.map(d => `${d.fechaStrOperacional} ${String(d.hora).padStart(2,'0')}:${String(d.minuto).padStart(2,'0')}`);
      const dataLAeq = datos.map(d => d.LAeq_1min);
      const dataLAmax = datos.map(d => d.LAmax_1min);
      const dataLCeq = datos.map(d => d.LCeq_1min);

      chart1MinInstance.data.labels = labels;
      chart1MinInstance.data.datasets[0].data = dataLAeq;
      chart1MinInstance.data.datasets[1].data = dataLAmax;
      chart1MinInstance.data.datasets[2].data = dataLCeq;
      chart1MinInstance.update();
    }

    // ==========================================
    // 1. FUNCIONALIDAD: EXPORTAR CSV FILTRADO
    // ==========================================
    function descargarCSVFiltrado() {
      if (!datosBrutosGlobales || datosBrutosGlobales.length === 0) {
        alert("No hay datos históricos disponibles para exportar.");
        return;
      }

      const fInicio = document.getElementById('export-inicio').value;
      const fFin = document.getElementById('export-fin').value;

      let datosFiltrados = datosBrutosGlobales;

      // Aplicar filtro si se selecciona alguna fecha
      if (fInicio || fFin) {
        datosFiltrados = datosBrutosGlobales.filter(d => {
          if (fInicio && d.fechaStrOperacional < fInicio) return false;
          if (fFin && d.fechaStrOperacional > fFin) return false;
          return true;
        });
      }

      if (datosFiltrados.length === 0) {
        alert("No se encontraron registros dentro del rango de fechas seleccionado.");
        return;
      }

      let csvContent = "data:text/csv;charset=utf-8,Timestamp,Fecha_Calendario,Fecha_Operacional,Hora,LAeq_1min,LAmax_1min,LCeq_1min\n";

      datosFiltrados.forEach(d => {
        const horaStr = `${String(d.hora).padStart(2, '0')}:${String(d.minuto).padStart(2, '0')}:00`;
        const laeq = d.LAeq_1min !== null ? d.LAeq_1min.toFixed(2) : "";
        const lamax = d.LAmax_1min !== null ? d.LAmax_1min.toFixed(2) : "";
        const lceq = d.LCeq_1min !== null ? d.LCeq_1min.toFixed(2) : "";

        csvContent += `${d.timestamp},${d.fechaStrCalendario},${d.fechaStrOperacional},${horaStr},${laeq},${lamax},${lceq}\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `reporte_acustico_${fInicio || 'inicio'}_a_${fFin || 'fin'}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // ==========================================
    // 2. FUNCIONALIDAD: BORRAR HISTORIAL FIREBASE
    // ==========================================
    async function borrarHistorialFirebase() {
      const confirmacion = confirm("⚠️ ¿Estás seguro de que deseas eliminar permanentemente todo el historial de mediciones de Firebase?");
      if (!confirmacion) return;

      try {
        const respuesta = await fetch(FIREBASE_URL, {
          method: 'DELETE'
        });

        if (respuesta.ok) {
          alert("El historial ha sido eliminado correctamente de la base de datos.");
          datosBrutosGlobales = [];
          actualizarTarjetas(null);
          actualizarGrafico([]);
        } else {
          alert("No se pudo eliminar el historial. Revisa las reglas de escritura (.write) en tu consola Firebase.");
        }
      } catch (error) {
        console.error("Error al eliminar los datos:", error);
        alert("Ocurrió un error al intentar comunicar con Firebase.");
      }
    }
  </script>
</body>
</html>
