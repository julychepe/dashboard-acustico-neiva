<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Ruido Ambiental</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
    .card { background-color: #1e293b; border-radius: 8px; padding: 15px; border: 1fr solid #334155; }
    .card-title { font-size: 0.8rem; text-transform: uppercase; color: #94a3b8; font-weight: 600; margin-bottom: 8px; }
    .card-value { font-size: 1.8rem; font-weight: bold; }
    .text-blue { color: #38bdf8; }
    .text-green { color: #4ade80; }
    .text-red { color: #f87171; }
    .chart-card { background-color: #1e293b; border-radius: 8px; padding: 20px; grid-column: span 4; }
    .live-badge { background-color: #334155; color: #94a3b8; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; float: right; }
  </style>
</head>
<body>

  <div class="grid-container">
    <div class="card">
      <span class="live-badge">EN VIVO</span>
      <div class="card-title">Tiempo Real (1min)</div>
      <div id="laeq-actual" class="card-value text-blue">--.- dBA</div>
      <div style="margin-top: 10px; font-size: 0.85rem;">
        Ponderación C: <span id="lceq-actual" class="text-green">--.- dBC</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">LAeq Promedio</div>
      <div id="laeq-promedio" class="card-value text-blue">--.- dBA</div>
    </div>

    <div class="card">
      <div class="card-title">Mínimo / Máximo</div>
      <div style="font-size: 1.1rem; margin-top: 5px;">
        Mín: <span id="laeq-min" class="text-blue">--.- dBA</span><br>
        Máx: <span id="laeq-max" class="text-red">--.- dBA</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Total Muestras</div>
      <div id="total-muestras" class="card-value text-green">0</div>
    </div>

    <div class="chart-card">
      <div class="card-title">Evolución Temporal del Ruido Ambiental</div>
      <canvas id="noiseChart" height="100"></canvas>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Reemplaza con las credenciales de tu proyecto en Firebase
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_PROYECTO.firebaseapp.com",
      databaseURL: "https://TU_PROYECTO-default-rtdb.firebaseio.com",
      projectId: "TU_PROYECTO"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const ruidoRef = ref(db, "lecturas"); // Nombre exacto del nodo en Firebase

    let chartInstance = null;

    // Escuchar datos en tiempo real
    onValue(ruidoRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) return resetUI("Sin datos en Firebase");

      // Filtrar y procesar claves push
      const registros = Object.keys(data)
        .map(key => data[key])
        .filter(item => item && item.timestamp && item.LAeq_1min !== undefined)
        .sort((a, b) => a.timestamp - b.timestamp);

      if (registros.length === 0) return resetUI("Sin registros válidos");

      actualizarUI(registros);
    });

    function actualizarUI(registros) {
      const ultimo = registros[registros.length - 1];

      // 1. Mostrar valores del último registro
      document.getElementById("laeq-actual").innerText = `${ultimo.LAeq_1min.toFixed(1)} dBA`;
      document.getElementById("lceq-actual").innerText = `${(ultimo.LCeq_1min || 0).toFixed(1)} dBC`;
      document.getElementById("total-muestras").innerText = registros.length;

      // 2. Mínimos, máximos y promedio logarítmico
      const valores = registros.map(r => r.LAeq_1min);
      document.getElementById("laeq-min").innerText = `${Math.min(...valores).toFixed(1)} dBA`;
      document.getElementById("laeq-max").innerText = `${Math.max(...valores).toFixed(1)} dBA`;

      const sumaEnergia = valores.reduce((acc, v) => acc + Math.pow(10, 0.1 * v), 0);
      const laeqProm = 10 * Math.log10(sumaEnergia / valores.length);
      document.getElementById("laeq-promedio").innerText = `${laeqProm.toFixed(1)} dBA`;

      // 3. Generar etiquetas de tiempo (*1000)
      const etiquetas = registros.map(r => {
        const d = new Date(r.timestamp * 1000);
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      });

      actualizarGrafica(etiquetas, valores);
    }

    function actualizarGrafica(labels, data) {
      const ctx = document.getElementById('noiseChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'LAeq (dBA)',
            data: data,
            borderColor: '#38bdf8',
            borderWidth: 2,
            fill: false,
            tension: 0.2
          }]
        },
        options: {
          responsive: true,
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
          }
        }
      });
    }

    function resetUI(msg) {
      console.warn(msg);
      document.getElementById("laeq-actual").innerText = "--.- dBA";
      document.getElementById("total-muestras").innerText = "0";
    }
  </script>
</body>
</html>
