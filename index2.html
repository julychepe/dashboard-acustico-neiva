<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Ruido Ambiental</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    
    .grid-top { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
    
    .card { background-color: #1e293b; border-radius: 8px; padding: 20px; border: 1px solid #334155; }
    .card-title { font-size: 0.8rem; text-transform: uppercase; color: #94a3b8; font-weight: 600; margin-bottom: 8px; }
    .card-value { font-size: 2.2rem; font-weight: bold; }
    
    .text-blue { color: #38bdf8; }
    .text-green { color: #4ade80; }
    .text-amber { color: #f59e0b; }
    .text-purple { color: #a855f7; }
    
    .sub-metrics { margin-top: 12px; font-size: 0.9rem; font-weight: 600; }
    .chart-card { background-color: #1e293b; border-radius: 8px; padding: 20px; }
    .live-badge { background-color: #334155; color: #94a3b8; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; float: right; }
    .status-banner { background-color: #0284c7; color: white; padding: 8px 12px; border-radius: 6px; margin-bottom: 15px; font-size: 0.85rem; }
    .legend-container { display: flex; gap: 15px; font-size: 0.85rem; margin-top: 10px; color: #94a3b8; }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .color-box { width: 12px; height: 12px; border-radius: 2px; }
  </style>
</head>
<body>

  <div id="status-banner" class="status-banner">Conectando con Firebase...</div>

  <!-- Tarjetas Principales -->
  <div class="grid-top">
    <div class="card">
      <span class="live-badge">EN VIVO</span>
      <div class="card-title">TIEMPO REAL (2S)</div>
      <div id="laeq-actual" class="card-value text-blue">--.- dBA</div>
      <div class="sub-metrics">
        PONDERACIÓN C: <span id="lceq-actual" class="text-green">--.- dBC</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Promedio $L_d$ (Día) / $L_n$ (Noche)</div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
        <div>Día (07-21h): <span id="ld-promedio" class="card-value text-amber" style="font-size: 1.6rem;">--.- dBA</span></div>
        <div>Noche (21-07h): <span id="ln-promedio" class="card-value text-purple" style="font-size: 1.6rem;">--.- dBA</span></div>
      </div>
    </div>
  </div>

  <!-- Gráfica de Evolución Temporal -->
  <div class="chart-card">
    <div class="card-title">Evolución temporal del ruido ambiental</div>
    
    <div class="legend-container">
      <div class="legend-item"><div class="color-box" style="background: #f59e0b;"></div> Periodo Diurno ($L_d$)</div>
      <div class="legend-item"><div class="color-box" style="background: #a855f7;"></div> Periodo Nocturno ($L_n$)</div>
      <div class="legend-item"><div class="color-box" style="background: #ef4444;"></div> Límite Día (65 dBA)</div>
      <div class="legend-item"><div class="color-box" style="background: #3b82f6;"></div> Límite Noche (50 dBA)</div>
    </div>

    <canvas id="noiseChart" height="100" style="margin-top: 15px;"></canvas>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_PROYECTO.firebaseapp.com",
      databaseURL: "https://TU_PROYECTO-default-rtdb.firebaseio.com",
      projectId: "TU_PROYECTO"
    };

    let chartInstance = null;
    let firebaseConectado = false;

    const timeoutFallback = setTimeout(() => {
      if (!firebaseConectado) {
        document.getElementById("status-banner").innerText = "Modo Demostración: Cargando registros de prueba.";
        document.getElementById("status-banner").style.backgroundColor = "#d97706";
        cargarDatosDemo();
      }
    }, 3000);

    try {
      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      const ruidoRef = ref(db, "/");

      onValue(ruidoRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
          firebaseConectado = true;
          clearTimeout(timeoutFallback);
          document.getElementById("status-banner").innerText = "Conectado exitosamente a Firebase.";
          document.getElementById("status-banner").style.backgroundColor = "#16a34a";

          const registros = Object.values(data)
            .filter(item => item && typeof item === 'object' && item.LAeq_1min !== undefined)
            .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

          if (registros.length > 0) actualizarUI(registros);
          else cargarDatosDemo();
        }
      });
    } catch (e) {
      console.warn("Configuración Firebase no válida:", e);
    }

    function cargarDatosDemo() {
      const ahora = Math.floor(Date.now() / 1000);
      const registrosDemo = [
        { LAeq_1min: 62.4, LCeq_1min: 48.1, timestamp: ahora - 3600 * 5 },
        { LAeq_1min: 68.2, LCeq_1min: 50.1, timestamp: ahora - 3600 * 4 },
        { LAeq_1min: 74.0, LCeq_1min: 52.0, timestamp: ahora - 3600 * 3 },
        { LAeq_1min: 77.26, LCeq_1min: 51.7, timestamp: ahora - 3600 * 2 },
        { LAeq_1min: 52.8, LCeq_1min: 49.5, timestamp: ahora - 3600 * 1 },
        { LAeq_1min: 48.2, LCeq_1min: 47.3, timestamp: ahora }
      ];
      actualizarUI(registrosDemo);
    }

    function actualizarUI(registros) {
      const ultimo = registros[registros.length - 1];

      // Tarjeta Tiempo Real
      document.getElementById("laeq-actual").innerText = `${ultimo.LAeq_1min.toFixed(1)} dBA`;
      document.getElementById("lceq-actual").innerText = `${(ultimo.LCeq_1min || 0).toFixed(1)} dBC`;

      // Clasificación Día (07:00 - 21:00) / Noche (21:00 - 07:00)
      const datosDia = [];
      const datosNoche = [];

      registros.forEach(r => {
        const ts = r.timestamp > 10000000000 ? r.timestamp : r.timestamp * 1000;
        const hora = new Date(ts).getHours();
        
        if (hora >= 7 && hora < 21) datosDia.push(r.LAeq_1min);
        else datosNoche.push(r.LAeq_1min);
      });

      const ld = calcularLAeqLog(datosDia);
      const ln = calcularLAeqLog(datosNoche);

      document.getElementById("ld-promedio").innerText = ld > 0 ? `${ld.toFixed(1)} dBA` : "--.- dBA";
      document.getElementById("ln-promedio").innerText = ln > 0 ? `${ln.toFixed(1)} dBA` : "--.- dBA";

      // Preparar datos para Gráfica
      const etiquetas = [];
      const valoresLAeq = registros.map(r => r.LAeq_1min);
      const coloresPuntos = [];

      registros.forEach(r => {
        const ts = r.timestamp > 10000000000 ? r.timestamp : r.timestamp * 1000;
        const fechaObj = new Date(ts);
        const hora = fechaObj.getHours();

        etiquetas.push(fechaObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
        coloresPuntos.push(hora >= 7 && hora < 21 ? '#f59e0b' : '#a855f7');
      });

      actualizarGrafica(etiquetas, valoresLAeq, coloresPuntos);
    }

    function calcularLAeqLog(arr) {
      if (!arr || arr.length === 0) return 0;
      const sumaEnergia = arr.reduce((acc, v) => acc + Math.pow(10, 0.1 * v), 0);
      return 10 * Math.log10(sumaEnergia / arr.length);
    }

    function actualizarGrafica(labels, data, pointColors) {
      const ctx = document.getElementById('noiseChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      const limiteDia = new Array(data.length).fill(65);
      const limiteNoche = new Array(data.length).fill(50);

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Medición LAeq (dBA)',
              data: data,
              borderColor: '#cbd5e1',
              pointBackgroundColor: pointColors,
              pointBorderColor: pointColors,
              pointRadius: 5,
              borderWidth: 1.5,
              fill: false,
              tension: 0.2
            },
            {
              label: 'Límite Día (65 dBA)',
              data: limiteDia,
              borderColor: '#ef4444',
              borderWidth: 2,
              borderDash: [6, 6],
              pointRadius: 0,
              fill: false
            },
            {
              label: 'Límite Noche (50 dBA)',
              data: limiteNoche,
              borderColor: '#3b82f6',
              borderWidth: 2,
              borderDash: [6, 6],
              pointRadius: 0,
              fill: false
            }
          ]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
            y: { 
              ticks: { color: '#94a3b8' }, 
              grid: { color: '#334155' },
              suggestedMin: 40,
              suggestedMax: 90
            }
          }
        }
      });
    }
  </script>
</body>
</html>
